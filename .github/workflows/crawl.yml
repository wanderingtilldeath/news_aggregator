name: crawl

# Digest crawl (every 6 hours) for the free demo. The web service is serve-only, so this
# job is the only thing that fetches pages. It runs crawlerx, waits for the
# digest run to finish, stops it, prunes old rows, then builds a snapshot of the
# last 7 days and deploys it with the Cloudflare Worker (see edge/). The snapshot
# only changes when this job runs.
on:
  schedule:
    - cron: "30 0,6,12,18 * * *" # 06:00, 11:30, 17:30, 23:30 IST
  workflow_dispatch:

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # The Gemini, Brevo and Telegram secrets and the mail variables live in this environment; a job
    # without it only reads repository-level values and silently skips the email step.
    environment: Production
    # The wait below allows 50 minutes for the crawl and the model work, and the prune, snapshot, deploy and mail follow it.
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Sites that asked not to be crawled or shown (comma separated hosts); see the sources page.
      BLOCKED_HOSTS: ${{ vars.BLOCKED_HOSTS }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKERS: "16"
      SOURCES: sources.json
      RUN_ON_START: "true"
      # Crawl 30m + model work 12m + the quiz and intro (up to 4m) must stay under the 50 minutes the step below waits: a
      # slow site then costs its own pages, not the summaries and the snapshot.
      CRAWL_TIMEOUT: "30m"
      # The model work of one run (summaries, enrichment, concepts) stops after this, so an overloaded model (HTTP 503)
      # cannot stretch the run; what is left stays pending for the next run.
      LLM_BUDGET: "12m"
      # A request cap on top of that time: the bulk model passes (summaries, first enrichment stage) stop at this many
      # requests, retries included, so a bad day cannot use the free quota in one run. About 30 are normal.
      LLM_MAX_REQUESTS: ${{ vars.LLM_MAX_REQUESTS || '220' }}
      # How many days of pages are kept (the site shows at most 30). Lower it when the admin Storage table nears the limit.
      PAGE_RETENTION_DAYS: ${{ vars.PAGE_RETENTION_DAYS || '60' }}
      # India time, the edition day everywhere else (API, snapshot, Worker): quiz, intro and mail are stored per this day
      TIMEZONE: Asia/Kolkata
      MAX_SITES: "60"
      IMAGE_CACHE_MB: "32"
      GOMEMLIMIT: 1500MiB
      # auto uses Gemini when the GEMINI_API_KEY secret is set, else the extractive gist
      SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER || 'auto' }}
      # Optional: a second Gemini model tried when the main one stays overloaded (set it as a variable).
      SUMMARY_FALLBACK_MODEL: ${{ vars.SUMMARY_FALLBACK_MODEL }}
      # A week is what the snapshot holds. A cold database or a new source would queue 30 days of backlog with the
      # old value of 30; for a one-off backfill, run the workflow with this variable raised and set it back.
      SUMMARY_WINDOW_DAYS: ${{ vars.SUMMARY_WINDOW_DAYS || '7' }}
      SUMMARY_BATCH: "12"
      USER_AGENT: ${{ vars.USER_AGENT || format('CrawlerX/1.0 (+https://github.com/{0})', github.repository) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # wrangler is a pinned devDependency of edge/, so its download comes from this cache.
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -tags timetzdata -ldflags="-s -w" -o crawlerx ./cmd/crawlerx

      - name: Crawl and summarise
        run: |
          # -listen= disables the API; the env var cannot, an empty value means "default".
          ./crawlerx -listen= > run.log 2>&1 &
          pid=$!
          done_=0
          for _ in $(seq 1 600); do
            if grep -q 'digest run complete' run.log; then done_=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 5
          done
          kill -TERM "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          tail -n 40 run.log
          if [ "$done_" != 1 ]; then echo "digest run did not complete" >&2; exit 1; fi

      # "digest run complete" is logged even when nothing useful happened, so check the result itself: the model
      # rejected our key (every gist would silently be the extractive fallback), or far fewer new articles than
      # 57 sources normally give in a day. A red run here skips the prune, the snapshot and the mail, so the last
      # good snapshot stays up. MIN_NEW_ARTICLES is a repository variable; 20 is a floor, not a target.
      - name: Check the run
        env:
          MIN_NEW_ARTICLES: ${{ vars.MIN_NEW_ARTICLES || '20' }}
        run: |
          if grep -Eq 'model credentials rejected|provider rejected the credentials' run.log; then
            echo "The model provider rejected the credentials (GEMINI_API_KEY): gists were not written." >&2
            exit 1
          fi
          new=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tA -c "SELECT count(*) FROM pages WHERE is_article AND first_seen_at > now() - interval '24 hours'")
          echo "new articles in the last 24 hours: $new (floor $MIN_NEW_ARTICLES)"
          if [ "$new" -lt "$MIN_NEW_ARTICLES" ]; then
            echo "Only $new new articles in 24 hours, below the floor of $MIN_NEW_ARTICLES: check the sources." >&2
            exit 1
          fi

      - name: Prune old rows
        run: |
          # Undated pages are kept: re-crawling would make them look new again. The retention is a number of days,
          # never below the 30 the site shows.
          case "$PAGE_RETENTION_DAYS" in ''|*[!0-9]*) echo "PAGE_RETENTION_DAYS must be a whole number" >&2; exit 1;; esac
          if [ "$PAGE_RETENTION_DAYS" -lt 30 ]; then echo "PAGE_RETENTION_DAYS must be at least 30" >&2; exit 1; fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "DELETE FROM crawls WHERE created_at < now() - interval '3 days'" \
            -c "DELETE FROM pages WHERE published_at < now() - make_interval(days => $PAGE_RETENTION_DAYS)"
          # Per-day records that only matter for a day or two (a send, a post, a run claim) or that the
          # site shows for a few weeks (quiz, intro). pro_payments is kept: it is the payment record.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "DELETE FROM deliveries WHERE edition_day < current_date - 60" \
            -c "DELETE FROM channel_posts WHERE edition_day < current_date - 60" \
            -c "DELETE FROM job_runs WHERE run_day < current_date - 60" \
            -c "DELETE FROM quizzes WHERE edition_day < current_date - 60" \
            -c "DELETE FROM intros WHERE edition_day < current_date - 60"
          # Retention: an address that signed up and never confirmed is not a subscriber. It is deleted after 30
          # days (the confirmation link is a one-time email, so nothing is lost). Confirmed and unsubscribed rows
          # stay: the first are the audience, the second is the record that the person asked for no mail.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "DELETE FROM subscribers WHERE confirmed_at IS NULL AND unsubscribed_at IS NULL AND created_at < now() - interval '30 days'"
          # A publisher's takedown: the site is no longer crawled (BLOCKED_HOSTS) and its stored pages go too,
          # and so do its stories in the monthly compilations (they outlive the pages), so the snapshot built
          # next has nothing of it. cmd/takedown does both; it does nothing when BLOCKED_HOSTS is empty.
          go run ./cmd/takedown

      # The Worker and the bot ship with the snapshot, so their tests gate the deploy.
      - name: Test the edge worker
        run: cd edge && node --test

      - name: Publish snapshot to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          scripts/build-snapshot.sh ./crawlerx edge/assets
          cd edge && npm ci && npx wrangler deploy

      # Fills Vercel's and Cloudflare's caches with the pages readers open first, so the first
      # reader after a deploy does not wait on a cold cache. It needs the WEB_BASE_URL variable
      # (and PUBLIC_API_URL for the newest stories) and never fails the job.
      - name: Warm the caches
        if: ${{ vars.WEB_BASE_URL != '' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        continue-on-error: true
        run: scripts/warm-caches.sh "${{ vars.WEB_BASE_URL }}" "${{ vars.PUBLIC_API_URL }}"

      - name: Snapshot skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Skipping the snapshot. Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to publish it."

      # Mails the day's edition once per day and posts it to the Telegram channels:
      # later runs of the day find every subscriber and channel already recorded and
      # send nothing. It runs only when the repository variable MAIL_PROVIDER is
      # "brevo" or a Telegram channel variable is set, because the log provider prints
      # each message, unsubscribe token included, into this (public) log. It runs after the
      # deploy, so a failure here turns the run red (and GitHub sends the failure mail) but
      # never blocks the deploy above.
      - name: Email the daily digest
        if: ${{ vars.MAIL_PROVIDER == 'brevo' || vars.TELEGRAM_CHAT_UPSC != '' || vars.TELEGRAM_CHAT_ENGINEERING != '' || vars.TEAM_POSTS == 'true' }}
        env:
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_UPSC: ${{ vars.TELEGRAM_CHAT_UPSC }}
          TELEGRAM_CHAT_ENGINEERING: ${{ vars.TELEGRAM_CHAT_ENGINEERING }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME || 'Postpaper' }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          MAIL_FOOTER: ${{ vars.MAIL_FOOTER }}
          TEAM_POSTS: ${{ vars.TEAM_POSTS }}
          MAIL_SPONSOR_TEXT: ${{ vars.MAIL_SPONSOR_TEXT }}
          MAIL_SPONSOR_URL: ${{ vars.MAIL_SPONSOR_URL }}
        run: |
          CGO_ENABLED=0 go build -trimpath -tags timetzdata -ldflags="-s -w" -o senddigest ./cmd/senddigest
          ./senddigest
