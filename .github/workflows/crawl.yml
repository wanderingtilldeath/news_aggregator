name: crawl

# Digest crawl (every 6 hours) for the free demo. The web service is serve-only, so this
# job is the only thing that fetches pages. It runs crawlerx, waits for the
# digest run to finish, stops it, prunes old rows, then builds a snapshot of the
# last 7 days and deploys it with the Cloudflare Worker (see edge/). The snapshot
# only changes when this job runs.
on:
  schedule:
    - cron: "30 0,6,12,18 * * *" # 06:00, 11:30, 17:30, 23:30 IST
  workflow_dispatch:

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # The Gemini, Brevo and Telegram secrets and the mail variables live in this environment; a job
    # without it only reads repository-level values and silently skips the email step.
    environment: Production
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Sites that asked not to be crawled or shown (comma separated hosts); see the sources page.
      BLOCKED_HOSTS: ${{ vars.BLOCKED_HOSTS }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKERS: "16"
      SOURCES: sources.json
      RUN_ON_START: "true"
      # Under the 40 minutes the step below waits: a slow site then costs its own pages, not the summaries and the snapshot.
      CRAWL_TIMEOUT: "30m"
      # India time, the edition day everywhere else (API, snapshot, Worker): quiz, intro and mail are stored per this day
      TIMEZONE: Asia/Kolkata
      MAX_SITES: "60"
      IMAGE_CACHE_MB: "32"
      GOMEMLIMIT: 1500MiB
      # auto uses Gemini when the GEMINI_API_KEY secret is set, else the extractive gist
      SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER || 'auto' }}
      SUMMARY_WINDOW_DAYS: ${{ vars.SUMMARY_WINDOW_DAYS || '30' }}
      SUMMARY_BATCH: "12"
      USER_AGENT: ${{ vars.USER_AGENT || format('CrawlerX/1.0 (+https://github.com/{0})', github.repository) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -tags timetzdata -ldflags="-s -w" -o crawlerx ./cmd/crawlerx

      - name: Crawl and summarise
        run: |
          # -listen= disables the API; the env var cannot, an empty value means "default".
          ./crawlerx -listen= > run.log 2>&1 &
          pid=$!
          done_=0
          for _ in $(seq 1 480); do
            if grep -q 'digest run complete' run.log; then done_=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 5
          done
          kill -TERM "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          tail -n 40 run.log
          if [ "$done_" != 1 ]; then echo "digest run did not complete" >&2; exit 1; fi

      - name: Prune old rows
        run: |
          # Undated pages are kept: re-crawling would make them look new again.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "DELETE FROM crawls WHERE created_at < now() - interval '3 days'" \
            -c "DELETE FROM pages WHERE published_at < now() - interval '60 days'"
          # A publisher's takedown: the site is no longer crawled (BLOCKED_HOSTS) and its stored
          # pages go too, so the snapshot built next has nothing of it.
          if [ -n "${BLOCKED_HOSTS// /}" ]; then
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v blocked="$BLOCKED_HOSTS" <<'SQL'
          DELETE FROM pages
          WHERE regexp_replace(COALESCE(lower(substring(url from '^https?://([^/?#]+)')), ''), '^www\.', '')
            = ANY (SELECT regexp_replace(trim(lower(h)), '^www\.', '') FROM unnest(string_to_array(:'blocked', ',')) AS h WHERE trim(h) <> '');
          SQL
          fi

      - name: Publish snapshot to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          scripts/build-snapshot.sh ./crawlerx edge/assets
          cd edge && npx --yes wrangler@4 deploy

      # Fills Vercel's and Cloudflare's caches with the pages readers open first, so the first
      # reader after a deploy does not wait on a cold cache. It needs the WEB_BASE_URL variable
      # (and PUBLIC_API_URL for the newest stories) and never fails the job.
      - name: Warm the caches
        if: ${{ vars.WEB_BASE_URL != '' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        continue-on-error: true
        run: scripts/warm-caches.sh "${{ vars.WEB_BASE_URL }}" "${{ vars.PUBLIC_API_URL }}"

      - name: Snapshot skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Skipping the snapshot. Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to publish it."

      # Mails the day's edition once per day and posts it to the Telegram channels:
      # later runs of the day find every subscriber and channel already recorded and
      # send nothing. It runs only when the repository variable MAIL_PROVIDER is
      # "brevo" or a Telegram channel variable is set, because the log provider prints
      # each message, unsubscribe token included, into this (public) log. It runs after the
      # deploy, so a failure here turns the run red (and GitHub sends the failure mail) but
      # never blocks the deploy above.
      - name: Email the daily digest
        if: ${{ vars.MAIL_PROVIDER == 'brevo' || vars.TELEGRAM_CHAT_UPSC != '' || vars.TELEGRAM_CHAT_ENGINEERING != '' || vars.TEAM_POSTS == 'true' }}
        env:
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_UPSC: ${{ vars.TELEGRAM_CHAT_UPSC }}
          TELEGRAM_CHAT_ENGINEERING: ${{ vars.TELEGRAM_CHAT_ENGINEERING }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME || 'Postpaper' }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          MAIL_FOOTER: ${{ vars.MAIL_FOOTER }}
          TEAM_POSTS: ${{ vars.TEAM_POSTS }}
          MAIL_SPONSOR_TEXT: ${{ vars.MAIL_SPONSOR_TEXT }}
          MAIL_SPONSOR_URL: ${{ vars.MAIL_SPONSOR_URL }}
        run: |
          CGO_ENABLED=0 go build -trimpath -tags timetzdata -ldflags="-s -w" -o senddigest ./cmd/senddigest
          ./senddigest
