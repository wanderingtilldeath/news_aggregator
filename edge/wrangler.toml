name = "news-digest-edge"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# The Render web service (no trailing slash). Only the 30-day view, text search
# and the dashboard still go there.
ORIGIN = "https://news-aggregator-4jjy.onrender.com"
# The public site, for the links the Telegram bot sends (no trailing slash).
WEB_URL = "https://www.postpaper.in"
# The bot also needs two secrets, set once with `wrangler secret put`: TELEGRAM_BOT_TOKEN and
# TELEGRAM_WEBHOOK_SECRET (any long random string, also passed to setWebhook).

# Keep Render awake: it sleeps after 15 min idle. Every 10 min from 05:30 to 00:30 IST (cron is UTC), and not overnight, so
# the always-on hours stay well inside Render's free 750 a month (about 590 used).
[triggers]
crons = ["*/10 0-18 * * *"]

# edge/assets is generated by scripts/build-snapshot.sh in the daily crawl job.
[assets]
directory = "./assets"
binding = "ASSETS"
# Serve files at their exact paths, so /digest.html is the page and /digest stays
# the API (the default would turn /digest.html into /digest).
html_handling = "none"
# Only the front page and the two API paths run the Worker before the assets are
# checked (with html_handling "none" the Worker maps / to /index.html).
run_worker_first = ["/", "/digest", "/digest/sources"]
