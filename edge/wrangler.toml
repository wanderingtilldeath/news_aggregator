name = "news-digest-edge"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# The Render web service (no trailing slash). Only the 30-day view, text search
# and the dashboard still go there.
ORIGIN = "https://news-aggregator-4jjy.onrender.com"

# edge/assets is generated by scripts/build-snapshot.sh in the daily crawl job.
[assets]
directory = "./assets"
binding = "ASSETS"
# Serve files at their exact paths, so /digest.html is the page and /digest stays
# the API (the default would turn /digest.html into /digest).
html_handling = "none"
# Only the front page and the two API paths run the Worker before the assets are
# checked (with html_handling "none" the Worker maps / to /index.html).
run_worker_first = ["/", "/digest", "/digest/sources"]
